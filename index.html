<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Valentine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ffebf3 0%, #ffe6f2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            z-index: 10;
            position: relative;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2);
            backdrop-filter: blur(5px);
            border: 2px solid #ff4d94;
        }
        
        h1 {
            color: #ff3385;
            font-size: 2.8rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
        }
        
        .tennis-icon {
            color: #ff3385;
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }
        
        .question-text {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 40px;
            font-weight: 600;
            line-height: 1.4;
        }
        
        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 18px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            min-width: 160px;
        }
        
        .btn-yes {
            background-color: #ff4d94;
            color: white;
        }
        
        .btn-yes:hover {
            background-color: #ff3385;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 51, 133, 0.3);
        }
        
        .btn-no {
            background-color: #4d79ff;
            color: white;
        }
        
        .btn-no:hover {
            background-color: #3366ff;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(51, 102, 255, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .hidden {
            display: none;
        }
        
        .response-message {
            margin-top: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #ffebf3 0%, #ffd9e9 100%);
            border-radius: 15px;
            border: 2px dashed #ff4d94;
            animation: fadeIn 1s ease;
        }
        
        .response-message h2 {
            color: #ff3385;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        
        .response-message p {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        .date-highlight {
            color: #ff3385;
            font-weight: bold;
            font-size: 1.8rem;
            display: block;
            margin: 10px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            border: 2px solid #ffccdd;
        }
        
        .heart {
            color: #ff4d94;
        }
        
        /* GIF Container Styles */
        .gif-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 30px 0;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .gif-item {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            background: white;
            padding: 5px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .gif-item:hover {
            transform: scale(1.05);
        }
        
        .gif-item img {
            width: 100%;
            height: auto;
            max-height: 200px;
            object-fit: contain;
            display: block;
            border-radius: 10px;
        }
        
        .gif-loading {
            color: #ff4d94;
            font-size: 2rem;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        
        .match-made {
            font-size: 1.8rem;
            color: #ff3385;
            font-weight: bold;
            margin-top: 25px;
            font-style: italic;
            padding: 15px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 240, 245, 0.9) 100%);
            border-radius: 10px;
            border: 2px solid #ffccdd;
        }
        
        /* IMPROVED CIRCULAR BALLOONS */
        .balloon {
            position: absolute;
            z-index: 1;
            pointer-events: none;
        }
        
        .balloon-body {
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #ff4d94, #ff66b2);
            border-radius: 50%;
            position: relative;
            box-shadow: 
                inset -10px -10px 20px rgba(0, 0, 0, 0.1),
                inset 5px 5px 20px rgba(255, 255, 255, 0.4),
                0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* Balloon shine effect */
        .balloon-body:before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            top: 10px;
            left: 10px;
            filter: blur(2px);
        }
        
        .balloon .string {
            position: absolute;
            width: 2px;
            height: 80px;
            background: rgba(0, 0, 0, 0.2);
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
        }
        
        .balloon .heart-shape {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #ffebf3;
            transform: rotate(45deg);
            top: 18px;
            left: 18px;
            z-index: 2;
        }
        
        .balloon .heart-shape:before,
        .balloon .heart-shape:after {
            content: "";
            position: absolute;
            width: 24px;
            height: 24px;
            background: #ffebf3;
            border-radius: 50%;
        }
        
        .balloon .heart-shape:before {
            top: -12px;
            left: 0;
        }
        
        .balloon .heart-shape:after {
            top: 0;
            left: -12px;
        }
        
        /* Tennis ball balloons */
        .balloon.tennis {
            z-index: 0;
        }
        
        .balloon.tennis .balloon-body {
            background: radial-gradient(circle at 30% 30%, #FFD700, #ffcc00);
            border: 2px solid rgba(0, 0, 0, 0.1);
        }
        
        .balloon.tennis .heart-shape {
            background: #ff4d94;
        }
        
        .balloon.tennis .heart-shape:before,
        .balloon.tennis .heart-shape:after {
            background: #ff4d94;
        }
        
        /* Heart-shaped balloons */
        .balloon.heart-shape-balloon {
            z-index: 0;
        }
        
        .balloon.heart-shape-balloon .balloon-body {
            background: linear-gradient(145deg, #ff66b2, #ff3385);
            width: 50px;
            height: 50px;
            transform: rotate(45deg);
        }
        
        .balloon.heart-shape-balloon .balloon-body:before,
        .balloon.heart-shape-balloon .balloon-body:after {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            background: inherit;
            border-radius: 50%;
        }
        
        .balloon.heart-shape-balloon .balloon-body:before {
            top: -25px;
            left: 0;
        }
        
        .balloon.heart-shape-balloon .balloon-body:after {
            top: 0;
            left: -25px;
        }
        
        .balloon.heart-shape-balloon .string {
            top: 50px;
        }
        
        .balloon.heart-shape-balloon .heart-shape {
            display: none;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-25px) rotate(5deg);
            }
        }
        
        @keyframes gentle-sway {
            0%, 100% {
                transform: translateX(0) rotate(0deg);
            }
            50% {
                transform: translateX(15px) rotate(2deg);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .question-text {
                font-size: 1.5rem;
            }
            
            .btn {
                padding: 15px 30px;
                font-size: 1.3rem;
                min-width: 140px;
            }
            
            .response-message h2 {
                font-size: 2rem;
            }
            
            .response-message p {
                font-size: 1.3rem;
            }
            
            .date-highlight {
                font-size: 1.5rem;
            }
            
            .gif-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .match-made {
                font-size: 1.5rem;
                padding: 12px;
            }
            
            .gif-item {
                min-height: 120px;
            }
            
            .gif-item img {
                max-height: 150px;
            }
            
            /* Smaller balloons on mobile */
            .balloon-body {
                width: 45px;
                height: 45px;
            }
            
            .balloon .heart-shape {
                width: 18px;
                height: 18px;
                top: 13px;
                left: 13px;
            }
            
            .balloon .heart-shape:before,
            .balloon .heart-shape:after {
                width: 18px;
                height: 18px;
            }
            
            .balloon .heart-shape:before {
                top: -9px;
            }
            
            .balloon .heart-shape:after {
                left: -9px;
            }
            
            .balloon .string {
                height: 60px;
                top: 45px;
            }
            
            .balloon.heart-shape-balloon .balloon-body {
                width: 40px;
                height: 40px;
            }
            
            .balloon.heart-shape-balloon .balloon-body:before,
            .balloon.heart-shape-balloon .balloon-body:after {
                width: 40px;
                height: 40px;
            }
            
            .balloon.heart-shape-balloon .balloon-body:before {
                top: -20px;
            }
            
            .balloon.heart-shape-balloon .balloon-body:after {
                left: -20px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .question-text {
                font-size: 1.3rem;
            }
            
            .buttons-container {
                gap: 15px;
            }
            
            .btn {
                padding: 12px 25px;
                font-size: 1.2rem;
                min-width: 130px;
            }
            
            .container {
                padding: 20px;
            }
            
            .response-message {
                padding: 20px;
            }
            
            .date-highlight {
                font-size: 1.3rem;
            }
            
            .match-made {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <i class="fas fa-tennis-ball tennis-icon"></i>
        <h1>Tennis Valentine</h1>
        
        <div class="question-text">Will you be my Tennis Valentine?</div>
        
        <div class="buttons-container">
            <button class="btn btn-yes" id="yesBtn">YES</button>
            <button class="btn btn-no" id="noBtn">NO</button>
        </div>
        
        <div class="response-message hidden" id="responseMessage">
            <h2><i class="fas fa-heart heart"></i> I knew you'd say YES! <i class="fas fa-heart heart"></i></h2>
            
            <p><strong>Can't wait to see you on</strong></p>
            <span class="date-highlight">February 14, 2026</span>
            <p>Bring your racket and your smile!</p>
            
            <!-- GIF Container -->
            <div class="gif-container" id="gifContainer">
                <div class="gif-item">
                    <div class="gif-loading">
                        <i class="fas fa-heart"></i>
                    </div>
                    <img src="https://media.giphy.com/media/bggcU4UxhO3ZNVxF8l/giphy.gif" 
                         alt="Tennis ball heart GIF"
                         onload="this.previousElementSibling.style.display='none'"
                         onerror="this.style.display='none'; this.previousElementSibling.innerHTML='<i class=\'fas fa-tennis-ball\'></i>'">
                </div>
                <div class="gif-item">
                    <div class="gif-loading">
                        <i class="fas fa-heart"></i>
                    </div>
                    <img src="https://media.giphy.com/media/I8fSr6sIkWv8y8CjpM/giphy.gif" 
                         alt="Love tennis GIF"
                         onload="this.previousElementSibling.style.display='none'"
                         onerror="this.style.display='none'; this.previousElementSibling.innerHTML='<i class=\'fas fa-heartbeat\'></i>'">
                </div>
                <div class="gif-item">
                    <div class="gif-loading">
                        <i class="fas fa-heart"></i>
                    </div>
                    <img src="https://media.giphy.com/media/htjNzYPCtQqhJ6B0Jh/giphy.gif" 
                         alt="Tennis love GIF"
                         onload="this.previousElementSibling.style.display='none'"
                         onerror="this.style.display='none'; this.previousElementSibling.innerHTML='<i class=\'fas fa-table-tennis\'></i>'">
                </div>
                <div class="gif-item">
                    <div class="gif-loading">
                        <i class="fas fa-heart"></i>
                    </div>
                    <img src="https://media.giphy.com/media/UrVd7PnfHrHu3iPAF3/giphy.gif" 
                         alt="Heart tennis GIF"
                         onload="this.previousElementSibling.style.display='none'"
                         onerror="this.style.display='none'; this.previousElementSibling.innerHTML='<i class=\'fas fa-kiss-wink-heart\'></i>'">
                </div>
            </div>
            
            <div class="match-made">
                Game, set, match... made in heaven! <i class="fas fa-heart heart"></i>
            </div>
        </div>
    </div>

    <!-- Balloons will be generated by JavaScript -->
    
    <script>
        // Create improved circular balloons
        function createBalloons() {
            const colors = ['#ff4d94', '#ff66b2', '#ff80cc', '#ff99dd'];
            const body = document.body;
            const balloonCount = 10; // Reduced slightly for better performance
            
            for (let i = 0; i < balloonCount; i++) {
                const balloon = document.createElement('div');
                
                // Random balloon type (70% regular, 20% tennis, 10% heart-shaped)
                const rand = Math.random();
                let balloonType = 'regular';
                if (rand < 0.7) balloonType = 'regular';
                else if (rand < 0.9) balloonType = 'tennis';
                else balloonType = 'heart-shape';
                
                balloon.className = `balloon ${balloonType}`;
                
                // Random position
                const leftPos = Math.random() * 95;
                const topPos = Math.random() * 95;
                
                // Random color for regular balloons
                const colorIndex = Math.floor(Math.random() * colors.length);
                const balloonColor = colors[colorIndex];
                
                // Random size variation
                const size = 40 + Math.random() * 30;
                
                // Random animation delay and duration
                const delay = Math.random() * 5;
                const duration = 4 + Math.random() * 3;
                const swayDelay = Math.random() * 3;
                const swayDuration = 5 + Math.random() * 4;
                
                // Apply styles
                balloon.style.left = `${leftPos}%`;
                balloon.style.top = `${topPos}%`;
                
                // Set balloon body size
                const balloonBody = document.createElement('div');
                balloonBody.className = 'balloon-body';
                balloonBody.style.width = `${size}px`;
                balloonBody.style.height = `${size}px`;
                
                // Set color for regular balloons
                if (balloonType === 'regular') {
                    balloonBody.style.background = `linear-gradient(145deg, ${balloonColor}, ${adjustColor(balloonColor, -20)})`;
                }
                
                // Add balloon parts
                const string = document.createElement('div');
                string.className = 'string';
                
                const heartShape = document.createElement('div');
                heartShape.className = 'heart-shape';
                
                balloon.appendChild(balloonBody);
                balloon.appendChild(string);
                balloon.appendChild(heartShape);
                
                // Apply animations
                balloon.style.animation = `float ${duration}s ease-in-out ${delay}s infinite`;
                
                // Add gentle sway animation
                string.style.animation = `gentle-sway ${swayDuration}s ease-in-out ${swayDelay}s infinite`;
                
                body.appendChild(balloon);
            }
        }
        
        // Helper function to adjust color brightness
        function adjustColor(color, amount) {
            const colorHex = color.replace('#', '');
            const num = parseInt(colorHex, 16);
            const r = Math.max(0, Math.min(255, (num >> 16) + amount));
            const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
            const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amount));
            return `#${(r << 16 | g << 8 | b).toString(16).padStart(6, '0')}`;
        }
        
        // DOM Elements
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const responseMessage = document.getElementById('responseMessage');
        const buttonsContainer = document.querySelector('.buttons-container');
        const questionText = document.querySelector('.question-text');
        const gifContainer = document.getElementById('gifContainer');
        
        // Make the NO button move away when hovered or touched
        function moveNoButton() {
            // Move button to random position
            const maxX = window.innerWidth - noBtn.offsetWidth - 40;
            const maxY = window.innerHeight - noBtn.offsetHeight - 40;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
            noBtn.style.transition = 'all 0.5s ease';
            
            // Reset after 1 second
            setTimeout(() => {
                noBtn.style.position = '';
                noBtn.style.left = '';
                noBtn.style.top = '';
            }, 1000);
        }
        
        // Add event listeners for NO button
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveNoButton();
        });
        
        // When YES is clicked
        yesBtn.addEventListener('click', function() {
            // Hide buttons and question
            buttonsContainer.classList.add('hidden');
            questionText.classList.add('hidden');
            
            // Show response message
            responseMessage.classList.remove('hidden');
            
            // Add more balloons
            for (let i = 0; i < 8; i++) {
                setTimeout(createBalloons, i * 200);
            }
            
            // Change title
            document.querySelector('h1').textContent = "You said YES!";
            
            // Force load GIFs if they haven't loaded yet
            loadGIFs();
        });
        
        // Create initial balloons
        createBalloons();
        
        // Add some interactivity to balloons
        document.addEventListener('click', function(e) {
            // If user clicks near a balloon, move it
            const balloon = e.target.closest('.balloon');
            if (balloon) {
                // Give it a push effect
                const moveX = (Math.random() - 0.5) * 100;
                const moveY = (Math.random() - 0.5) * 100;
                
                balloon.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${Math.random() * 20 - 10}deg)`;
                
                // Return to original position after a moment
                setTimeout(() => {
                    balloon.style.transform = '';
                }, 500);
            }
        });
        
        // Function to load GIFs with retry logic
        function loadGIFs() {
            const gifItems = document.querySelectorAll('.gif-item img');
            const backupGifs = [
                'https://media.giphy.com/media/bggcU4UxhO3ZNVxF8l/giphy.gif',
                'https://media.giphy.com/media/I8fSr6sIkWv8y8CjpM/giphy.gif',
                'https://media.giphy.com/media/htjNzYPCtQqhJ6B0Jh/giphy.gif',
                'https://media.giphy.com/media/UrVd7PnfHrHu3iPAF3/giphy.gif'
            ];
            
            // Alternative URLs in case the primary ones don't work
            const altGifs = [
                'https://media1.giphy.com/media/bggcU4UxhO3ZNVxF8l/giphy.gif?cid=ecf05e47&rid=giphy.gif&ct=g',
                'https://media3.giphy.com/media/I8fSr6sIkWv8y8CjpM/giphy.gif?cid=ecf05e47&rid=giphy.gif&ct=g',
                'https://media2.giphy.com/media/htjNzYPCtQqhJ6B0Jh/giphy.gif?cid=ecf05e47&rid=giphy.gif&ct=g',
                'https://media0.giphy.com/media/UrVd7PnfHrHu3iPAF3/giphy.gif?cid=ecf05e47&rid=giphy.gif&ct=g'
            ];
            
            gifItems.forEach((img, index) => {
                // If image hasn't loaded, try alternative URL
                if (!img.complete || img.naturalHeight === 0) {
                    // Set loading state
                    img.style.display = 'none';
                    
                    // Try loading with a timestamp to avoid cache issues
                    const newImg = new Image();
                    newImg.onload = function() {
                        img.src = this.src;
                        img.style.display = 'block';
                        if (img.previousElementSibling) {
                            img.previousElementSibling.style.display = 'none';
                        }
                    };
                    
                    newImg.onerror = function() {
                        // Try alternative URL
                        const altImg = new Image();
                        altImg.onload = function() {
                            img.src = this.src;
                            img.style.display = 'block';
                            if (img.previousElementSibling) {
                                img.previousElementSibling.style.display = 'none';
                            }
                        };
                        altImg.onerror = function() {
                            // Show fallback icon if all URLs fail
                            if (img.previousElementSibling) {
                                img.previousElementSibling.innerHTML = '<i class="fas fa-heart-broken"></i> GIF not available';
                                img.previousElementSibling.style.color = '#ff4d94';
                            }
                        };
                        altImg.src = altGifs[index];
                    };
                    
                    // Add timestamp to avoid cache
                    newImg.src = backupGifs[index] + '?' + new Date().getTime();
                }
            });
        }
        
        // Preload GIFs when page loads
        window.addEventListener('load', function() {
            // Start loading GIFs in background
            loadGIFs();
            
            // Make sure GIFs load when response message is shown
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    if (mutation.target.id === 'responseMessage' && 
                        !mutation.target.classList.contains('hidden')) {
                        // Response message is now visible, ensure GIFs load
                        setTimeout(loadGIFs, 100);
                    }
                });
            });
            
            observer.observe(responseMessage, { attributes: true, attributeFilter: ['class'] });
        });
        
        // Make balloons responsive on window resize
        window.addEventListener('resize', function() {
            // Reset NO button position
            noBtn.style.position = '';
            noBtn.style.left = '';
            noBtn.style.top = '';
        });
        
        // Add click sound effect for YES button
        yesBtn.addEventListener('click', function() {
            // Create a simple click sound using Web Audio API
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 523.25; // C5 note
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (e) {
                // Audio not supported, continue silently
            }
        });
    </script>
